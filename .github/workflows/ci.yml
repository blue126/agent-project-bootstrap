name: Bootstrap CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck -S style scripts/*.sh tests/*.sh

  bootstrap-validation:
    name: bootstrap-validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate shell syntax
        run: bash -n scripts/*.sh tests/*.sh

      - name: Validate Ruleset JSON
        run: jq empty github/rulesets/protect-main.json

      - name: Set up Python for skill helper tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Provision isolated skill helper dependencies
        run: |
          python3 -m venv "${RUNNER_TEMP}/installbmad-python"
          "${RUNNER_TEMP}/installbmad-python/bin/python" -m pip install --disable-pip-version-check --no-cache-dir -r skills/installbmad/requirements.txt
          printf '%s\n' "${RUNNER_TEMP}/installbmad-python/bin" >> "${GITHUB_PATH}"

      - name: Run all repository tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: for test_file in tests/test-*.sh; do bash "${test_file}"; done
